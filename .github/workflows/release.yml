name: Release
on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commit + tags
      pull-requests: write # "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The OIDC token exchange is done by the npm CLI (>= 11.5.1), which pnpm publish delegates to.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Opens/updates the "Version Packages" PR while changesets are pending.
      - id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Once that PR is merged: publish unpublished versions via trusted publishing. No npm token on purpose,
      # so a misconfigured trusted publisher fails loudly instead of silently falling back to a token.
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release && git push --tags
        env:
          NPM_CONFIG_PROVENANCE: 'true'
