name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: sources-${{ hashFiles('pipeline/build.ts') }}
      - run: pnpm install --frozen-lockfile
      # build runs the data pipeline, which fails if any integrity check fails
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Bundle budgets (.size-limit.json); fails the PR when a package grows past its limit
      - run: pnpm size
      # Real-browser test of the example app (uses the runner's installed Chrome)
      - run: pnpm --filter example-vite e2e
      # Docs + playground (IndexedDB cache, axe) and Next.js App Router (server-rendered provinsi, plain form submit)
      - run: pnpm --filter docs e2e
      - run: pnpm --filter example-next e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The same component tests against React 18 (peer range ^18 || ^19). Last, because it rewrites the lockfile.
      - run: pnpm --filter @nusawilayah/react add -D react@^18.3.1 react-dom@^18.3.1 && pnpm --filter @nusawilayah/react test
